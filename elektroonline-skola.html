<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13202E">
<title>ElektroOnline Škola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: dark control-panel band on top, hazard-stripe divider, then a light "workbench" with drawing-sheet figures */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#13202E; --muted:#4F5D6E; --line:#D5DCE4;
  --band:#13202E; --band-ink:#F2F5F8; --band-muted:#A9B5C3;
  --accent:#F2B000; --accent-ink:#13202E;
  --l0:#6D28D9; --l0-bg:#EDE7FB; --l4:#0F766E; --l4-bg:#DDF3F0;
  --l1:#1F7A3D; --l1-bg:#E1F3E7; --l2:#1F4FB8; --l2-bg:#E2EAFB; --l3:#B4460E; --l3-bg:#FCE9DC;
  --warn:#B42318; --warn-bg:#FDECEA; --note:#8A5A00; --note-bg:#FFF6D9;
  --ok:#15803D;
  --f-display:"Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#151F2A; --ink:#E7ECF2; --muted:#9DAABA; --line:#283545;
  --band:#080D13; --band-ink:#F2F5F8; --band-muted:#93A0AF;
  --accent:#F5BC1A; --accent-ink:#13202E;
  --l0:#C4B0FF; --l0-bg:#2A1F4A; --l4:#5EDBCB; --l4-bg:#123733;
  --l1:#6FD394; --l1-bg:#173323; --l2:#8DB1FF; --l2-bg:#1A2846; --l3:#FFA36B; --l3-bg:#3A2112;
  --warn:#FF8A80; --warn-bg:#3A1714; --note:#FFD46B; --note-bg:#342810; --ok:#6FD394;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#151F2A; --ink:#E7ECF2; --muted:#9DAABA; --line:#283545;
  --band:#080D13; --band-ink:#F2F5F8; --band-muted:#93A0AF;
  --accent:#F5BC1A; --accent-ink:#13202E;
  --l0:#C4B0FF; --l0-bg:#2A1F4A; --l4:#5EDBCB; --l4-bg:#123733;
  --l1:#6FD394; --l1-bg:#173323; --l2:#8DB1FF; --l2-bg:#1A2846; --l3:#FFA36B; --l3-bg:#3A2112;
  --warn:#FF8A80; --warn-bg:#3A1714; --note:#FFD46B; --note-bg:#342810; --ok:#6FD394;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top band */
.top{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-mark{width:38px;height:38px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em}
.brand-name span{color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav a{color:#FFFFFF;text-decoration:none;font-weight:700;font-size:15px;padding:9px 14px;border-radius:8px;border:2px solid transparent}
.nav a[data-nav="zakladny"]{background:#1F7A3D}
.nav a[data-nav="stredny"]{background:#1F4FB8}
.nav a[data-nav="pokrocily"]{background:#B4460E}
.nav a[data-nav="teoria"]{background:#6D28D9}
.nav a[data-nav="projekty"]{background:#0F766E}
.nav a[data-nav="videa"]{background:#F2B000;color:#13202E}
.nav a:hover{filter:brightness(1.12)}
.nav a[aria-current="page"]{border-color:#FFFFFF;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.langs{display:flex;gap:6px;margin-left:auto}
.lang-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;border-radius:8px;border:2px solid #3B4A5C;background:transparent;color:#F2F5F8;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.lang-btn svg{border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.lang-btn[aria-pressed="true"]{border-color:#F2B000;background:rgba(242,176,0,.14)}
.lang-btn:hover{border-color:#93A0AF}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--band) 14px 28px)}

/* hero */
.hero{background:var(--band);color:var(--band-ink)}
.hero .wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding-block:48px 56px}
.hero-text{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.hero .eyebrow{color:var(--accent)}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:900;font-stretch:78%;letter-spacing:-.01em}
.hero p{color:var(--band-muted);font-size:18px;max-width:58ch}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:10px;font-weight:700;font-size:16px;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-ghost{border-color:#3B4A5C;color:var(--band-ink);background:transparent}
.btn-ghost:hover{border-color:var(--band-muted)}
.btn-line{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-line:hover{border-color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:28px;margin-top:6px}
.facts div{font-size:14px;color:var(--band-muted)}
.facts b{display:block;font-family:var(--f-display);font-stretch:80%;font-size:30px;color:var(--band-ink);line-height:1.1}
.hero-fig{flex:1 1 420px;min-width:0}

/* drawing sheet */
.sheet{background:#FFFFFF;border:1px solid #CBD3DC;border-radius:12px;padding:14px;color:#1F2937;display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:#4B5563;border-bottom:1px dashed #CBD3DC;padding-bottom:8px}
.sheet-body{overflow-x:auto}
.sheet svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px;background:#F3F4F6;border:1px solid #E5E7EB;padding:4px 8px;border-radius:6px;color:#1F2937}
.legend i{width:20px;height:6px;border-radius:3px;display:block}

/* sections */
.section{padding-block:56px}
.section-head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;max-width:70ch}
.section-head h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.section-head p{color:var(--muted);font-size:17px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.level{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;text-decoration:none;transition:border-color .15s,transform .15s}
.level:hover{border-color:var(--muted);transform:translateY(-2px)}
.chip{align-self:flex-start;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.c0{color:var(--l0);background:var(--l0-bg)} .c4{color:var(--l4);background:var(--l4-bg)}
.c1{color:var(--l1);background:var(--l1-bg)} .c2{color:var(--l2);background:var(--l2-bg)} .c3{color:var(--l3);background:var(--l3-bg)}
.level h3{font-size:28px;font-weight:800}
.level p{color:var(--muted)}
.level ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.level .more{margin-top:auto;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.how b{font-size:17px}
.how span{color:var(--muted);font-size:15px}

.note-legal{font-size:14px;color:var(--muted);max-width:80ch}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}

/* course page */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.course-head{padding-block:36px 8px;display:flex;flex-direction:column;gap:14px}
.course-head h1{font-size:clamp(34px,5vw,52px);font-weight:900;font-stretch:80%}
.course-head p{color:var(--muted);font-size:17px;max-width:65ch}
.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);max-width:420px}
.progress .bar{flex:1}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding-block:20px 56px}
.lesson-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;text-decoration:none}
.lesson-card:hover{border-color:var(--muted)}
.num{flex:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.num.done{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.lesson-card b{display:block;font-size:16px;line-height:1.3}
.lesson-card small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.tag{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:5px}

/* lesson page */
.lesson{display:flex;flex-wrap:wrap;gap:28px;padding-block:28px 56px;align-items:flex-start}
.side{flex:1 1 250px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.side-title{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.3}
.side a:hover{background:var(--bg)}
.side a[aria-current="page"]{background:var(--note-bg);font-weight:700}
.side .dot{flex:none;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.side .dot.done{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.content{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:20px}
.content h1{font-size:clamp(30px,4.4vw,44px);font-weight:900;font-stretch:80%}
.lead{font-size:18px;color:var(--muted);max-width:65ch}
.cols{display:flex;flex-wrap:wrap;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:22px;font-weight:800}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;margin-top:1px}
.need{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.box-warn{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.box-warn .eyebrow{color:var(--warn)}
.box-note{background:var(--note-bg);border:1.5px dashed var(--note);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.box-note .eyebrow{color:var(--note)}
.placeholder{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.done-btn[aria-pressed="true"]{background:var(--ok);color:#FFFFFF;border-color:var(--ok)}
.quiz{display:flex;flex-direction:column;gap:18px}
.q{display:flex;flex-direction:column;gap:8px}
.q-text{font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{min-height:48px;text-align:left;font:inherit;font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.opt:hover{border-color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--l1-bg)}
.opt.sel{border-color:var(--l2);background:var(--l2-bg)}
.opt.bad{border-color:var(--warn);background:var(--warn-bg)}
.q-res{font-size:14px;font-weight:700}
.q-res.ok{color:var(--ok)} .q-res.bad{color:var(--warn)}
.foto{margin:0;display:flex;flex-direction:column;gap:8px}
.foto img{width:100%;max-height:460px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.foto-ph{border:2px dashed var(--line);border-radius:10px;padding:22px;display:flex;gap:14px;align-items:center;color:var(--muted)}
.foto-ph svg{flex:none}
.foto-ph b{display:block;color:var(--ink)}
.test-card{background:var(--band);color:var(--band-ink);border-radius:14px;padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:56px}
.test-card p{color:var(--band-muted)}
.score{font-family:var(--f-display);font-stretch:80%;font-size:44px;font-weight:900}
/* video player */
.player{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.vp-main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:0;background:var(--band);border-radius:14px;overflow:hidden}
.stage{position:relative;background:#FFFFFF;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;overflow:hidden}
.stage-svg{width:100%;padding:3%}
.stage-svg svg{display:block;width:100%;height:auto;max-height:100%}
.card-over{position:absolute;inset:0;display:none;place-items:center;padding:6%;text-align:center}
.card-over.show{display:grid;animation:fadein .4s ease-out}
.card-over>div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:36ch}
.card-over b{font-family:var(--f-display);font-stretch:82%;font-size:clamp(22px,3.6vw,38px);line-height:1.15}
.card-over span{font-size:clamp(14px,1.8vw,18px)}
.card-over.title{background:#13202E;color:#F2F5F8}.card-over.title .eyebrow{color:#F5BC1A}
.card-over.warn{background:rgba(253,236,234,.96);color:#7A1A12}.card-over.warn .eyebrow{color:#B42318}
.card-over.note{background:rgba(255,246,217,.97);color:#4A3200}.card-over.note .eyebrow{color:#8A5A00}
.card-over.end{background:#13202E;color:#F2F5F8}
.big-play{position:absolute;inset:auto;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;background:#F2B000;color:#13202E;border:0;border-radius:16px;padding:18px 26px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.big-play[hidden]{display:none}
.caption{min-height:3.6em;padding:14px 18px;color:#F2F5F8;font-size:clamp(15px,2vw,19px);font-weight:600;line-height:1.4;background:#0B131C}
.controls{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--band);flex-wrap:wrap}
.ctl{width:44px;height:44px;border-radius:10px;border:1px solid #3B4A5C;background:transparent;color:#F2F5F8;display:grid;place-items:center;cursor:pointer}
.ctl:hover{border-color:#93A0AF}
.ctl-main{background:#F2B000;color:#13202E;border-color:#F2B000}
.ctl.off{opacity:.5}
.vp-bar{flex:1 1 120px;display:flex;gap:4px;min-width:100px}
.vp-bar i{flex:1;height:6px;border-radius:3px;background:#3B4A5C}
.vp-bar i.done{background:#93A0AF}.vp-bar i.cur{background:#F2B000}
.speed select{min-height:44px;border-radius:10px;border:1px solid #3B4A5C;background:transparent;color:#F2F5F8;padding:0 8px;font:inherit}
.speed option{color:#13202E}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.vp-note{color:#93A0AF;font-size:13px;padding:0 14px 12px}
.vp-note:empty{display:none}
.vp-steps{flex:1 1 260px;min-width:0;margin:0;padding:16px 16px 16px 36px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.vp-steps li{color:var(--muted);transition:color .2s}
.vp-steps li.past{color:var(--ink)}
.vp-steps li.on{color:var(--ink);font-weight:700;background:var(--note-bg);border-radius:6px;padding:4px 8px;margin-left:-8px}
.num.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.num.play.c0{background:var(--l0);border-color:var(--l0);color:var(--surface)}
.num.play.c4{background:var(--l4);border-color:var(--l4);color:var(--surface)}
.num.play.c1{background:var(--l1);border-color:var(--l1);color:var(--surface)}
.num.play.c2{background:var(--l2);border-color:var(--l2);color:var(--surface)}
.num.play.c3{background:var(--l3);border-color:var(--l3);color:var(--surface)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== TELEFÓN ===== */
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden}
@media (max-width:700px){
  .top .wrap{gap:8px 10px;padding-block:8px 10px}
  .brand{gap:8px}
  .brand-mark{width:32px;height:32px}
  .brand-mark svg{width:18px;height:18px}
  .brand-name{font-size:19px}
  .langs{order:2;gap:5px}
  .lang-btn{min-height:34px;padding:4px 7px;font-size:0;gap:0}
  .lang-btn svg{width:21px;height:14px}
  .nav{order:3;flex:1 1 100%;flex-wrap:wrap;gap:6px}
  .nav a{white-space:nowrap;font-size:13.5px;padding:7px 8px;flex:1 1 auto;text-align:center}
  .hazard{height:6px}

  .hero .wrap{gap:24px;padding-block:24px 32px}
  .hero-text{gap:14px;flex-basis:100%}
  .hero-fig{flex-basis:100%}
  .hero p{font-size:16px}
  .eyebrow{font-size:11.5px;letter-spacing:.08em}
  .btns .btn{flex:1 1 auto;justify-content:center}
  .facts{gap:18px}
  .facts b{font-size:26px}

  .section{padding-block:34px}
  .section-head{margin-bottom:16px}
  .section-head p{font-size:15.5px}
  .levels{grid-template-columns:1fr;gap:12px}
  .level{padding:18px;gap:10px}

ónny": "Telephone", "Do rozvádzača": "Into the consumer unit", "Pod svietidlo": "Under the light", "Mimo dosahu svietidla": "Out of reach of the light", "Nekontroluješ ističe": "You do not check the breakers", "Nemeriaš": "You do not measure", "Nemeníš súčiastky naslepo": "You do not replace parts blindly", "Farbu": "Colour", "Výkon": "Power", "Čas svietenia": "Lighting time", "Do trojuholníka": "In delta", "Nedá sa": "It is not possible", "Do hviezdy": "In star", "Asi 70 %": "About 70 %", "Farbu vodičov": "Wire colours", "Hlučnosť": "Noise", "Že istič pri poruche včas vypne": "That the breaker trips in time during a fault", "Paralelne k START": "In parallel with START", "Paralelne k STOP": "In parallel with STOP", "Len v noci": "Only at night", "Nikdy": "Never", "Vždy na svetle": "Always in daylight", "Kontrolu a merania": "Checks and measurements", "Zapnem a uvidím": "I switch on and see", "Do zásuvky linky": "To the worktop sockets", "Na svetlá": "To the lights", "Žiadne": "None", "Vypínače": "Switches", "Fázy": "Phases", "Kovové časti a potrubia": "Metal parts and pipes", "400 V zásuvku": "A 400 V socket", "Zvonček": "A doorbell", "Do zásuvky pri umývadle": "To the socket by the washbasin", "Všetko na jeden": "Everything on one", "Podľa miestností": "By room", "Náhodne": "Randomly", "Na dva": "Into two", "Na jeden": "Into one", "Predlžovačku": "An extension lead", "Podružný rozvádzač s chráničom": "A sub-distribution board with an RCD", "Nad vaňou": "Above the bath", "Mimo zón 0, 1, 2": "Outside zones 0, 1, 2", "V zóne 0": "In zone 0", "Zapnem istič": "I switch on the breaker", "Odfotím trasy": "I photograph the routes", "Elektrina sa správa podobne ako voda v potrubí. Napätie je tlak, prúd je prietok a odpor je zúženie rúry.": "Electricity behaves much like water in a pipe. Voltage is the pressure, current is the flow and resistance is a narrowing of the pipe.", "Pozrieť ako video lekciu": "Watch as a video lesson", "Voda": "Water", "Elektrina": "Electricity", lows, the light is on", "Zdroj, vodiče a spotrebič tvoria okruh.": "The source, the wires and the load form a circuit.", "Keď je okruh uzavretý, prúd tečie a spotrebič funguje.": "When the circuit is closed, current flows and the load works.", "Vypínač okruh preruší a prúd prestane tiecť.": "A switch breaks the circuit and the current stops.", "V dome ide prúd po fáze L k spotrebiču a vracia sa po N.": "In a house, current flows along the live L to the load and returns along N.", "Myslieť si, že vodič, ktorým práve netečie prúd, je bez napätia.": "Thinking that a wire with no current flowing in it has no voltage.", "Bez uzavretého okruhu netečie prúd – napätie tam však byť môže.": "Without a closed circuit no current flows – but voltage can still be there.", "Kedy tečie prúd?": "When does current flow?", "Keď je okruh uzavretý": "When the circuit is closed", "Vždy": "Always", "Čo urobí vypínač?": "What does a switch do?", "Po ktorom vodiči sa prúd vracia?": "Along which wire does current return?", "Po L": "Through L", "Jednoduchý obvod s batériou, vypínačom a žiarovkou.": "A simple circuit with a battery, a switch and a bulb.", "Istič vypína pri skrate aj pri preťažení. Skrat je okamžitý a prudký, preťaženie pomalé.": "A breaker trips on both short circuit and overload. A short circuit is instant and violent, an overload is slow.", "Skrat": "Short circuit", "Preťaženie": "Overload", "fáza sa dotkne N": "live touches N", "obrovský prúd → istič vypne okamžite": "huge current → breaker trips instantly", "kanvica": "kettle", "fén": "hair dryer", "ohrievač": "heater", "kábel sa zahrieva": "the cable heats up", "istič vypne po chvíli": "breaker trips after a while", "Skrat vznikne, keď sa fáza dotkne N alebo PE bez spotrebiča.": "A short circuit happens when the live touches N or PE without a load in between.", "Pri skrate tečie obrovský prúd a istič vypne okamžite.": "In a short circuit a huge current flows and the breaker trips instantly.", "Preťaženie vznikne, keď na o ovka?": "Why is a neon screwdriver not enough?", "Je ťažká": "It is heavy", "Nie je spoľahlivá na overenie": "It is not reliable for verification", "Je drahá": "It is expensive", "Na čo slúžia krimpovacie kliešte?": "What are crimping pliers for?", "Na meranie": "For measuring", "Na strihanie rúrok": "For cutting conduit", "Na lisovanie dutiniek": "For crimping ferrules", "Sada náradia rozložená na stole.": "A tool set laid out on a table.", "Uvoľnený spoj sa zahrieva a je najčastejšou príčinou porúch v krabiciach.": "A loose joint heats up and is the most common cause of faults in junction boxes.", "Odizoluj na dĺžku": "Strip to the length", "podľa svorky": "given by the terminal", "Lanko vždy": "Stranded wire always", "s dutinkou": "with a ferrule", "Zasuň na doraz,": "Push in fully,", "páčky zatvor": "close the levers", "Ťahová skúška:": "Pull test:", "vodič musí držať": "the wire must hold", "Odizoluj presne na dĺžku, ktorú udáva svorka – býva vyznačená na jej boku.": "Strip exactly to the length given by the terminal – it is usually marked on its side.", "Pri lanku nasaď dutinku a zalisuj ju krimpovacími kliešťami.": "On stranded wire, fit a ferrule and crimp it with crimping pliers.", "Vodič zasuň až na doraz a jemným potiahnutím over, či drží.": "Push the wire in fully and check it holds with a gentle pull.", "Skontroluj, že z svorky netrčí holá meď.": "Check that no bare copper sticks out of the terminal.", "bezskrutkové svorky (napr. páčkové)": "screwless terminals (e.g. lever type)", "dutinky na lanká": "ferrules for stranded wire", "odizolovacie kliešte": "wire strippers", "Lanko bez dutinky do skrutkovej svorky – drôtiky sa rozstrapkajú a spoj sa časom uvoľní.": "Stranded wire without a ferrule in a screw terminal – the strands splay out and the joint loosens over time.", "Ťahová skúška každého vodiča po zapojení.": "Pull-test every wire after connecting.", "Čo dáš na koniec lanka?": "What goes on the end of stranded wire?", "Izolačku": "Insulating tape" const chain = (items, y, h = 80, opts = {}) => {
  let s = '';
  items.forEach((it, i) => {
    const x = it.x, wd = it.w || 120;
    s += rect(x, y, wd, h, {fill: it.fill || '#F8FAFC', rx: 10});
    (it.lines || []).forEach((ln, k) => s += t(x + wd / 2, y + h / 2 - ((it.lines.length - 1) * 9) + k * 18 + 5, ln, {anchor: 'middle', size: k === 0 ? 13 : 11, weight: k === 0 ? 700 : 600, fill: k === 0 ? C.ink : C.soft}));
    if (i < items.length - 1 && !opts.noArrow) s += arrow(x + wd + 2, y + h / 2, items[i + 1].x - 2, y + h / 2);
  });
  return s;
};

const order = (key, n) => { const a = [...Array(n).keys()]; let x = hash(key) || 1; for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

}

      </section>
      ${QUIZ[id] ? `<section class="panel quiz"><h2>Kontrolné otázky</h2>${QUIZ[id].map((q, i) => qHtml(`${id}-${i}`, q)).join('')}</section>` : ''}
      <div class="btns"><button type="button" id="done-btn" class="btn btn-line done-btn" aria-pressed="${!!done[id]}">${done[id] ? '✓ Lekcia hotová' : 'Označiť ako hotovú'}</button></div>
      <div class="pager">
        ${prev ? `<a class="btn btn-line" href="#l-${prev.id}">← ${esc(prev.title)}</a>` : `<a class="btn btn-line" href="#${c.key}">← Prehľad kurzu</a>`}
        ${next ? `<a class="btn btn-accent" href="#l-${next.id}">${esc(next.title)} →</a>` : nextCourse ? `<a class="btn btn-accent" href="#${nextCourse}">Pokračovať: ${COURSES[nextCourse].name} →</a>` : `<a class="btn btn-accent" href="#uvod">Späť na úvod</a>`}
      </div>
    </article>
  </div></div>`;
}

/* ================= VIDEO LEKCIE: animovaný prehrávač ================= */
const lessonNum = l => { const k = l.course || ORDER.find(c => COURSES[c].lessons.some(x => x.id === l.id)); return `${COURSES[k].num}.${COURSES[k].lessons.findIndex(x => x.id === l.id) + 1}`; };

function videoList() {
  return `<div class="wrap"><div class="course-head">
    <nav class="crumbs" aria-label="Navigácia"><a href="#uvod">Úvod</a><span>/</span><span>Video lekcie</span></nav>
    <span class="eyebrow" style="color:var(--note)">Video lekcie</span>
    <h1>Video lekcie</h1>
    <p>Tie isté lekcie ako v kurzoch, ale ako kreslené video s komentárom. Schéma sa kreslí postupne a hlas ťa prevedie krok za krokom.</p></div>
    ${ORDER.map(k => { const c = COURSES[k]; return `<section style="padding-block:16px 8px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><span class="chip ${c.chip}">${c.level}</span><h2 style="font-size:26px;font-weight:800">${c.name}</h2></div>
      <div class="lessons" style="padding-block:0 24px">${c.lessons.map(l => `<a class="lesson-card" href="#v-${l.id}"><span class="num play ${c.chip}" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></span><span><b>${esc(l.title)}</b><small>Lekcia ${lessonNum(l)} · ${esc(l.sub)}</small></span></a>`).join('')}</div></section>`; }).join('')}
  </div>`;
}

function videoLesson(id) {
  const l = byId(id), c = COURSES[l.course], i = c.lessons.findIndex(x => x.id === id);
  const prev = c.lessons[i - 1], next = c.lessons[i + 1];
  return `<div class="wrap" style="padding-block:24px 56px;display:flex;flex-direction:column;gap:18px">
    <nav class="crumbs" aria-label="Navigácia"><a href="#uvod">Úvod</a><span>/</span><a href="#videa">Video lekcie</a><span>/</span><span>Lekcia ${lessonNum(l)}</span></nav>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="eyebrow" style="color:var(--note)">Video lekcia ${lessonNum(l)} · ${c.name}</span><h1 style="font-size:clamp(28px,4vw,42px);font-weight:900;font-stretch:80%">${esc(l.title)}</h1></div>
      <a class="btn btn-line" href="#l-${id}">Prečítať ako obrázkovú lekciu</a>
    </div>
    <div class="player" id="player">
      <div class="vp-main">
        <div class="stage" id="stage"><div class="stage-svg" id="stage-svg"></div><div class="card-over" id="card-over"></div>
          <button type="button" class="big-play" id="big-play" aria-label="Spustiť video"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg><span>Spustiť video</span></button></div>
        <div class="caption" id="caption" aria-live="polite"></div>
        <div class="controls">
          <button type="button" class="ctl" id="vp-prev" aria-label="Predchádzajúci krok"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
          <button type="button" class="ctl ctl-main" id="vp-play" aria-label="Prehrať"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
          <button type="button" class="ctl" id="vp-next" aria-label="Ďalší krok"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z" fill="currentColor"/></svg></button>
          <div class="vp-bar" id="vp-bar" aria-hidden="true"></div>
          <button type="button" class="ctl" id="vp-mute" aria-label="Vypnúť zvuk" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9a4 4 0 010 6M19.5 6.5a8 8 0 010 11"/></svg></button>
          <label class="speed"><span class="sr">Rýchlosť</span><select id="vp-speed"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.2">1,2×</option></select></label>
        </div>
        <p class="vp-note" id="vp-note"></p>
      </div>
      <ol class="vp-steps" id="vp-steps">${l.steps.map((s, k) => `<li data-step="${k}">${esc(s)}</li>`).join('')}</ol>
    </div>
    <div class="pager">
      ${prev ? `<a class="btn btn-line" href="#v-${prev.id}">← ${esc(prev.title)}</a>` : `<a class="btn btn-line" href="#videa">← Všetky video lekcie</a>`}
      ${next ? `<a class="btn btn-accent" href="#v-${next.id}">${esc(next.title)} →</a>` : `<a class="btn btn-accent" href="#videa">Všetky video lekcie</a>`}
    </div>
  </div>`;
}

const PLAYER = (() => {
  let st = null;
  const synth = (typeof window !== 'undefined' && 'speechSynthesis' in window) ? window.speechSynthesis : null;
  let voice = null;
  const pickVoice = () => { try { const v = synth.getVoices(); voice = LANG === 'en' ? (v.find(x => /^en[-_]GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null) : (v.find(x => /^sk/i.test(x.lang)) || null); } catch (e) { voice = null; } };
  if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) {} }

  function scenes(l) {
    const num = lessonNum(l);
    const en = LANG === 'en';
    return [
      {type: 'title', text: `${en ? 'Lesson' : 'Lekcia'} ${num}. ${tr(l.title)}. ${tr(l.sub)}`},
      {type: 'draw', text: tr(l.lead)},
      ...l.steps.map((s, i) => ({type: 'step', n: i, text: `${en ? 'Step' : 'Krok'} ${i + 1}. ${tr(s)}`, show: tr(s)})),
      {type: 'warn', text: `${tr('Častá chyba')}. ${tr(l.mistake)}`, show: tr(l.mistake)},
      {type: 'note', text: `${tr('Zapamätaj si')}. ${tr(l.remember)}`, show: tr(l.remember)},
      {type: 'end', text: tr('Koniec lekcie. Vedomosti si over v kontrolných otázkach.')}
    ];
  }
  const estimate = (text, rate) => Math.max(2600, text.length * 68 / rate);

  function prepDiagram(l) {
    const host = document.getElementById('stage-svg');
    host.innerHTML = DIAGRAMS[l.diagram].svg();
    const svgEl = host.querySelector('svg');
    const items = [...svgEl.children].slice(1);
    items.forEach(el => {
      const tag = el.tagName.toLowerCase();
      const dashed = el.getAttribute('stroke-dasharray');
      if (['polyline', 'line', 'path'].includes(tag) && !dashed && el.getAttribute('stroke') && el.getAttribute('stroke') !== 'none') {
        let len = 0; try { len = el.getTotalLength(); } catch (e) { len = 0; }
        if (len > 0) { el.dataset.len = len; el.style.strokeDasharray = len; el.style.strokeDashoffset = len; return; }
      }
      el.style.opacity = 0;
    });
    return items;
  }
  function drawAll(dur) {
    const items = st.items, n = items.length || 1, per = Math.max(250, dur * 0.35);
    st.anims = items.map((el, i) => {
      const delay = (dur - per) * (i / n);
      const kf = el.dataset.len ? [{strokeDashoffset: el.dataset.len}, {strokeDashoffset: 0}] : [{opacity: 0}, {opacity: 1}];
      try { const a = el.animate(kf, {duration: per, delay, fill: 'forwards', easing: 'ease-out'}); if (!st.playing) a.pause(); return a; } catch (e) { el.style.opacity = 1; el.style.strokeDashoffset = 0; return null; }
    }).filter(Boolean);
  }
  function showAllNow() { st.items.forEach(el => { (el.getAnimations ? el.getAnimations() : []).forEach(a => a.cancel()); el.style.opacity = 1; el.style.strokeDashoffset = 0; }); }
  function hideAll() { st.items.forEach(el => { (el.getAnimations ? el.getAnimations() : []).forEach(a => a.cancel()); if (el.dataset.len) el.style.strokeDashoffset = el.dataset.len; else el.style.opacity = 0; }); }

  function render() {
    const sc = st.sc[st.i], over = document.getElementById('card-over'), cap = document.getElementById('caption');
    cap.textContent = sc.show || sc.text;
    const cards = {title: ['title', `<span class="eyebrow">Lekcia ${lessonNum(st.l)}</span><b>${esc(st.l.title)}</b><span>${esc(st.l.sub)}</span>`], warn: ['warn', `<span class="eyebrow">Častá chyba</span><b>${esc(st.l.mistake)}</b>`], note: ['note', `<span class="eyebrow">Zapamätaj si</span><b>${esc(st.l.remember)}</b>`], end: ['end', `<b>Koniec lekcie</b><span>Pokračuj kontrolnými otázkami alebo ďalšou lekciou.</span><a class="btn btn-accent" href="#l-${st.l.id}">Kontrolné otázky</a>`]};
    if (cards[sc.type]) { over.className = 'card-over show ' + cards[sc.type][0]; over.innerHTML = `<div>${cards[sc.type][1]}</div>`; } else { over.className = 'card-over'; over.innerHTML = ''; }
    document.querySelectorAll('#vp-steps li').forEach(li => li.classList.toggle('on', sc.type === 'step' && +li.dataset.step === sc.n));
    document.querySelectorAll('#vp-steps li').forEach(li => li.classList.toggle('past', sc.type === 'step' ? +li.dataset.step < sc.n : st.i > st.sc.length - 4));
    const bar = document.getElementById('vp-bar');
    bar.innerHTML = st.sc.map((_, k) => `<i class="${k < st.i ? 'done' : k === st.i ? 'cur' : ''}"></i>`).join('');
    const pb = document.getElementById('vp-play');
    pb.innerHTML = st.playing ? '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>' : '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>';
    pb.setAttribute('aria-label', tr(st.playing ? 'Pozastaviť' : 'Prehrať')); pb.removeAttribute('data-o-aria-label');
    translateTree(document.getElementById('card-over')); translateTree(document.getElementById('vp-steps'));
  }

  function clearTimers() { clearTimeout(st.timer); st.timer = null; if (synth) { try { synth.cancel(); } catch (e) {} } st.token++; }

  function runScene() {
    clearTimers();
    const sc = st.sc[st.i], token = st.token;
    if (st.i > 1) showAllNow();
    if (sc.type === 'title' || (sc.type === 'draw' && !st.playing)) { if (sc.type === 'title') hideAll(); }
    render();
    if (!st.playing) return;
    const dur = estimate(sc.text, st.rate);
    if (sc.type === 'draw') { hideAll(); drawAll(Math.min(12000, Math.max(3500, dur))); }
    const advance = () => { if (token !== st.token || !st.playing) return; if (st.i < st.sc.length - 1) { st.i++; runScene(); } else { st.playing = false; render(); } };
    const useVoice = synth && !st.muted && voice;
    if (useVoice) {
      let fired = false;
      const u = new SpeechSynthesisUtterance(sc.text); u.lang = LANG === 'en' ? (voice && voice.lang || 'en-GB') : 'sk-SK'; u.voice = voice; u.rate = st.rate;
      u.onend = () => { if (fired) return; fired = true; st.timer = setTimeout(advance, 700); };
      u.onerror = () => { if (fired) return; fired = true; st.timer = setTimeout(advance, 400); };
      try { synth.speak(u); } catch (e) { fired = true; st.timer = setTimeout(advance, dur); }
      st.timer = setTimeout(() => { if (!fired) { fired = true; advance(); } }, dur * 2.2 + 4000);
    } else {
      st.timer = setTimeout(advance, dur);
    }
  }

  function play() { if (st.i >= st.sc.length - 1) st.i = 0; st.playing = true; document.getElementById('big-play').hidden = true; runScene(); }
  function pause() { st.playing = false; clearTimers(); (st.anims || []).forEach(a => { try { a.finish(); } catch (e) {} }); render(); }

  function mount(id) {
    stop();
    const l = byId(id);
    st = {l, sc: scenes(l), i: 0, playing: false, muted: false, rate: 1, token: 0, timer: null, anims: []};
    st.items = prepDiagram(l);
    render();
    const note = document.getElementById('vp-note');
    pickVoice();
    note.textContent = tr(!synth ? 'Tento prehliadač nevie čítať nahlas – video beží s titulkami.' : (!voice ? 'Slovenský hlas sa v tomto zariadení nenašiel – video beží s titulkami. Hlas pridáš v nastaveniach zariadenia (prevod textu na reč).' : ''));
    if (synth && !voice) setTimeout(() => { if (st && voice) note.textContent = ''; }, 1500);
    document.getElementById('big-play').addEventListener('click', play);
    document.getElementById('vp-play').addEventListener('click', () => st.playing ? pause() : play());
    document.getElementById('vp-next').addEventListener('click', () => { if (st.i < st.sc.length - 1) { st.i++; if (!st.playing) showAllNow(); runScene(); } });
    document.getElementById('vp-prev').addEventListener('click', () => { if (st.i > 0) { st.i--; runScene(); } });
    document.getElementById('vp-mute').addEventListener('click', e => { st.muted = !st.muted; e.currentTarget.setAttribute('aria-pressed', st.muted); e.currentTarget.classList.toggle('off', st.muted); if (st.playing) runScene(); });
    document.getElementById('vp-speed').addEventListener('change', e => { st.rate = +e.target.value; if (st.playing) runScene(); });
  }
  function stop() { if (st) { clearTimers(); st = null; } else if (synth) { try { synth.cancel(); } catch (e) {} } }
  return {mount, stop};
})();

/* ---------- router ---------- */
const app = document.getElementById('app');
function route(keepScroll) {
  const h = (location.hash || '').replace('#', '');
  let html, active = '';
  if (COURSES[h]) { html = course(h); active = h; }
  else if (h === 'videa') { html = videoList(); active = 'videa'; }
  else if (h.startsWith('v-') && byId(h.slice(2))) { html = videoLesson(h.slice(2)); active = 'videa'; }
  else if (h.startsWith('test-') && COURSES[h.slice(5)]) { html = testView(h.slice(5)); active = h.slice(5); }
  else if (h.startsWith('l-') && byId(h.slice(2))) { html = lesson(h.slice(2)); active = byId(h.slice(2)).course; }
  else html = home();
  if (keepScroll !== true) PLAYER.stop();
  app.innerHTML = html;
  if (h.startsWith('v-') && byId(h.slice(2))) PLAYER.mount(h.slice(2));
  translateTree(document.body);
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === active ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const btn = document.getElementById('done-btn');
  if (btn) btn.addEventListener('click', () => { const id = h.slice(2); done[id] = !done[id]; if (!done[id]) delete done[id]; saveDone(); route(true); });
  document.querySelectorAll('img[data-foto]').forEach(img => {
    const ph = img.nextElementSibling;
    const ok = () => { img.hidden = false; if (ph) ph.hidden = true; };
    img.addEventListener('load', ok);
    if (img.complete && img.naturalWidth > 0) ok();
  });
  if (keepScroll !== true) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => route());
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
applyLang();
app.addEventListener('click', e => {
  const o = e.target.closest('[data-q]');
  if (o) {
    const key = o.dataset.q, h = location.hash.replace('#', '');
    if (h.startsWith('test-') && tests[h.slice(5)] && tests[h.slice(5)].done) return;
    answers[key] = +o.dataset.i; route(true); return;
  }
  const ev = e.target.closest('[data-test-eval]');
  if (ev && !ev.disabled) {
    const k = ev.dataset.testEval, T = tests[k]; T.done = true;
    const score = T.qs.filter(x => answers[x.key] === x.q[2]).length;
    if (best[k] == null || score > best[k]) { best[k] = score; try { localStorage.setItem('eos-test', JSON.stringify(best)); } catch (err) {} }
    route(); return;
  }
  const nw = e.target.closest('[data-test-new]');
  if (nw) { startTest(nw.dataset.testNew); route(); }
});
route();
</script>
<script>
/* telefón: aktívna záložka v menu sa posunie do zorného poľa */
(function(){
  function show(){
    const a=document.querySelector('.nav a[aria-current="page"]'); if(!a) return;
    const n=a.parentElement; if(n.scrollWidth<=n.clientWidth) return;
    n.scrollTo({left:Math.max(0,a.offsetLeft-(n.clientWidth-a.offsetWidth)/2),behavior:'smooth'});
  }
  window.addEventListener('hashchange',()=>setTimeout(show,30));
  setTimeout(show,60);
})();
</script>
</body>
